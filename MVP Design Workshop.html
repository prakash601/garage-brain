create extension if not exists "uuid-ossp";

-- Customers: one customer can have many cars, phone is unique lookup
create table customers (
  id uuid primary key default uuid_generate_v4(),
  name text not null check (char_length(name) >= 2),
  phone text not null unique check (phone ~ '^[6-9][0-9]{9}$'),
  created_at timestamptz default now()
);

-- Cars: number_plate is natural PK, normalized UPPERCASE no spaces
create table cars (
  number_plate text primary key 
    check (number_plate ~ '^[A-Z]{2}[0-9]{2}[A-Z]{1,3}[0-9]{1,4}$'),
  make text not null,
  model text not null,
  fuel_type text check (fuel_type in ('Petrol','Diesel','CNG','Electric','Hybrid')),
  current_customer_id uuid references customers(id),
  created_at timestamptz default now()
);

-- Ownership history for 2nd owner / family member cases
create table car_ownership_history (
  id uuid primary key default uuid_generate_v4(),
  car_number_plate text references cars(number_plate) on delete cascade,
  customer_id uuid references customers(id),
  start_date date not null default current_date,
  end_date date,
  created_at timestamptz default now()
);

-- Job Cards: offline-first with synced flag
create type job_status as enum (
  'Arrived','Pending','Started','Completed','ReadyForDelivery'
);

create table job_cards (
  id uuid primary key default uuid_generate_v4(),
  car_number_plate text not null references cars(number_plate),
  customer_id uuid not null references customers(id),
  km_reading int check (km_reading >= 0),
  complaints text not null,
  status job_status not null default 'Arrived',
  notes text,
  created_by uuid references auth.users(id),
  created_at timestamptz default now(),
  synced boolean default false,
  updated_at timestamptz default now()
);

-- For Phase 2 Recommendations
create table recommendation_queue (
  id uuid primary key default uuid_generate_v4(),
  customer_id uuid references customers(id),
  car_number_plate text references cars(number_plate),
  type text check (type in ('service_due','churn','offer')),
  message text not null,
  scheduled_for date,
  sent boolean default false
);

-- RLS
alter table customers enable row level security;
alter table cars enable row level security;
alter table job_cards enable row level security;

-- Receptionist can read/write but not delete
-- Admin can do all (handled via auth.jwt role claim)

-- Customers: one customer can have many cars, phone is unique lookup
create table customers (
  id uuid primary key default uuid_generate_v4(),
  name text not null check (char_length(name) >= 2),
  phone text not null unique check (phone ~ '^[6-9][0-9]{9}$'),
  created_at timestamptz default now()
);

-- Cars: number_plate is natural PK, normalized UPPERCASE no spaces
create table cars (
  number_plate text primary key 
    check (number_plate ~ '^[A-Z]{2}[0-9]{2}[A-Z]{1,3}[0-9]{1,4}$'),
  make text not null,
  model text not null,
  fuel_type text check (fuel_type in ('Petrol','Diesel','CNG','Electric','Hybrid')),
  current_customer_id uuid references customers(id),
  created_at timestamptz default now()
);

-- Ownership history for 2nd owner / family member cases
create table car_ownership_history (
  id uuid primary key default uuid_generate_v4(),
  car_number_plate text references cars(number_plate) on delete cascade,
  customer_id uuid references customers(id),
  start_date date not null default current_date,
  end_date date,
  created_at timestamptz default now()
);

-- Job Cards: offline-first with synced flag
create type job_status as enum (
  'Arrived','Pending','Started','Completed','ReadyForDelivery'
);

create table job_cards (
  id uuid primary key default uuid_generate_v4(),
  car_number_plate text not null references cars(number_plate),
  customer_id uuid not null references customers(id),
  km_reading int check (km_reading >= 0),
  complaints text not null,
  status job_status not null default 'Arrived',
  notes text,
  created_by uuid references auth.users(id),
  created_at timestamptz default now(),
  synced boolean default false,
  updated_at timestamptz default now()
);

-- For Phase 2 Recommendations
create table recommendation_queue (
  id uuid primary key default uuid_generate_v4(),
  customer_id uuid references customers(id),
  car_number_plate text references cars(number_plate),
  type text check (type in ('service_due','churn','offer')),
  message text not null,
  scheduled_for date,
  sent boolean default false
);

-- RLS
alter table customers enable row level security;
alter table cars enable row level security;
alter table job_cards enable row level security;
